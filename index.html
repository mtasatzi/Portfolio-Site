<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matina Tasatzi | Portfolio</title>
  <link rel="preload" href="css/style.css" as="style">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Site Header & Navigation -->
  <header class="site-header">
    <div class="header-inner">
      <nav class="nav" aria-label="Main navigation">
        <a href="#about" class="nav-link" data-i18n="nav.about">About</a>
        <a href="#gallery" class="nav-link" data-i18n="nav.gallery">Gallery</a>
        <a href="#cv" class="nav-link" data-i18n="nav.cv">CV</a>
        <a href="#contact" class="nav-link" data-i18n="nav.contact">Contact</a>
      </nav>
      <a href="#home" class="logo-link" aria-label="Home">
        <img src="assets/logo.jpg" alt="Matina Tasatzi logo" class="logo" width="80" height="80">
      </a>
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language" type="button">
        <span class="lang-label lang-el">ΕΛ</span>
        <span class="lang-divider" aria-hidden="true">/</span>
        <span class="lang-label lang-en">EN</span>
      </button>
    </div>
  </header>

  <!-- Landing Page (Hero) -->
  <section id="home" class="hero landing-page">
    <div class="hero-top-bar">
      <button class="lang-toggle hero-lang-toggle" aria-label="Switch language" type="button">
        <span class="lang-label lang-el">ΕΛ</span>
        <span class="lang-divider" aria-hidden="true">/</span>
        <span class="lang-label lang-en">EN</span>
      </button>
    </div>
    <div class="hero-geom"></div>
    <div class="hero-content">
      <div class="hero-logo-wrap">
        <img src="assets/logo.jpg" alt="Matina Tasatzi logo" class="hero-logo" width="180" height="180">
      </div>
      <h1 data-i18n="hero.title">Matina Tasatzi</h1>
      <p class="hero-sub" data-i18n="hero.subtitle">Painting &amp; mixed media print making</p>
      <div class="hero-cta-wrap">
        <a href="#about" class="btn btn-primary btn-enter" data-i18n="hero.enter">Enter Portfolio</a>
      </div>
    </div>
  </section>

  <!-- About / Biography -->
  <section id="about" class="about">
    <div class="section-inner">
      <h2 class="section-title" data-i18n="about.title">About</h2>
      <div class="about-grid">
        <div class="about-text">
          <p data-i18n="about.bio"></p>
          <p id="about-exhibitions" class="about-exhibitions"></p>
        </div>
        <div class="about-image">
          <img id="about-image" src="assets/about.jpg" alt="Featured artwork" class="about-artwork">
        </div>
      </div>
    </div>
  </section>

  <!-- Chronological Timeline Gallery -->
  <section id="gallery" class="gallery">
    <div class="section-inner">
      <h2 class="section-title" data-i18n="gallery.title">Gallery</h2>
      <p class="gallery-intro" data-i18n="gallery.intro"></p>

      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- CV -->
  <section id="cv" class="cv">
    <div class="section-inner">
      <h2 class="section-title" data-i18n="cv.title">CV</h2>
      <p data-i18n="cv.intro"></p>
      <div class="cv-actions">
        <a id="cv-download" href="assets/cv.pdf" class="btn btn-outline" target="_blank" rel="noopener" data-i18n="cv.download">Download
          CV (PDF)</a>
      </div>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="contact">
    <div class="section-inner">
      <h2 class="section-title" data-i18n="contact.title">Contact</h2>
      <p class="contact-intro" data-i18n="contact.formIntro"></p>

      <div class="contact-wrap">
        <form class="contact-form" id="contact-form" action="https://formsubmit.co/mattina13@hotmail.com" method="POST">
          <input type="hidden" name="_subject" value="New inquiry from Matina Tasatzi Portfolio">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">

          <div class="form-row">
            <div class="form-group">
              <label for="contact-name" data-i18n="contact.name">Name</label>
              <input type="text" id="contact-name" name="name" required autocomplete="name"
                data-i18n-placeholder="contact.namePlaceholder">
            </div>
            <div class="form-group">
              <label for="contact-email" data-i18n="contact.email">Email</label>
              <input type="email" id="contact-email" name="email" required autocomplete="email"
                data-i18n-placeholder="contact.emailPlaceholder">
            </div>
          </div>

          <div class="form-group">
            <label for="contact-subject" data-i18n="contact.subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" required
              data-i18n-placeholder="contact.subjectPlaceholder">
          </div>

          <div class="form-group">
            <label for="contact-message" data-i18n="contact.message">Message</label>
            <textarea id="contact-message" name="message" rows="5" required
              data-i18n-placeholder="contact.messagePlaceholder"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-submit" id="contact-submit-btn" data-i18n="contact.send">Send
            message</button>
          <div id="form-feedback" class="form-feedback" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p data-i18n="footer.copyright">&copy; <span id="year"></span> Matina Tasatzi. All rights reserved.</p>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/i18n.js"></script>
</body>

</html>
